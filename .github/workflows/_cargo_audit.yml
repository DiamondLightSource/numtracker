name: Cargo lock check

on:
  workflow_call:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Audit Cargo.lock for security advisories
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
