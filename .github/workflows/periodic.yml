name: Periodic

on:
  workflow_dispatch:
  schedule:
    # Run weekly to check for new vulnerabilities
    - cron: "0 8 * * WED"

jobs:
  trivy:
    uses: ./.github/workflows/_trivy.yml

  cargo_audit:
    uses: ./.github/workflows/_cargo_audit.yml
    permissions:
      issues: write
      checks: write
